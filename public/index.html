<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#405bdc"><meta name="description" content="발표문부터 실전 질의응답까지, 나만의 발표 연습실"><title>발표 보스전 · 나만의 발표 연습실</title><link rel="stylesheet" href="./style.css"><script type="module" src="./app.js"></script></head>
<body><div id="app"></div><div id="toast" role="status" aria-live="polite"></div><dialog id="settings"><form method="dialog"><div class="section-head"><h2>연결 설정</h2><button class="icon-button" aria-label="닫기">✕</button></div><p class="muted">기본 점검은 바로 사용할 수 있어요. AI 심화 분석은 서버 연결이 필요해요.</p><label>AI 서버 주소<input id="server-url" type="url" placeholder="같은 서버라면 비워 두세요"></label><label>서버 접속 토큰<input id="access-token" type="password" autocomplete="off" placeholder="별도 서버에서 설정한 접속 토큰"></label><p class="small muted">AI 제공자의 API 키를 입력하는 곳이 아닙니다. 접속 토큰은 현재 탭에서만 보관됩니다.</p><button type="button" class="primary" id="save-settings">저장하고 연결 확인</button></form></dialog><input id="pdf-input" type="file" accept="application/pdf,.pdf" hidden><input id="restore-input" type="file" accept="application/json,.json" hidden></body></html>
